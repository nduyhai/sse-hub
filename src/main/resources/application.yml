spring:
  application:
    name: sse-hub
  datasource:
    url: jdbc:postgresql://localhost:5432/ssehub?currentSchema=public
    username: ssehub
    password: ssehub
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    connect-retries: 5

  modulith:
    events:
      republish-outstanding-events-on-restart: false
  data:
    redis:
      host: localhost
      port: 6379
  docker:
    compose:
      lifecycle-management: start_only
      file: docker-compose.yml

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      show-details: when-authorized

ssehub:
  scheduler:
    retry-delay-ms: 60000
  sse:
    heartbeat-interval-ms: 30000

logging:
  level:
    com.nduyhai.ssehub: INFO
    org.flywaydb: DEBUG
